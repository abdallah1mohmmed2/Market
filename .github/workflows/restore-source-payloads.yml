name: Restore staged source files
on:
  push:
    branches: [main]
    paths:
      - 'tools/upload_payload/RESTORE_NOW'
      - '.github/workflows/restore-source-payloads.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble staged payload chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('tools/upload_payload')
          groups = {}
          for p in root.glob('*.gz.b64.part*'):
              base = p.name.split('.part', 1)[0]
              groups.setdefault(base, []).append(p)
          for base, parts in groups.items():
              with (root / base).open('wb') as out:
                  for p in sorted(parts, key=lambda q: q.name):
                      out.write(p.read_bytes())
              for p in parts:
                  p.unlink()
          PY
      - name: Restore compressed source payloads
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          root = Path('.')
          for payload in sorted((root / 'tools/upload_payload').glob('*.gz.b64')):
              rel = payload.name[:-len('.gz.b64')].replace('__', '/')
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(payload.read_text().strip())))
              payload.unlink()
              print(f'Restored {rel}')
          PY
      - name: Commit restored source files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Restore original project files from upload batch'
            git push origin main
          fi
