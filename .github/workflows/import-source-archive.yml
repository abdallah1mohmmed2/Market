name: Import complete source archive

on:
  push:
    paths:
      - source_archive.zip
      - .github/workflows/import-source-archive.yml
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: github.event_name == 'push' && contains(github.event.head_commit.added, 'source_archive.zip')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Extract and restore project files
        shell: bash
        run: |
          set -euo pipefail
          test -f source_archive.zip
          mkdir -p /tmp/market-source
          unzip -oq source_archive.zip -d /tmp/market-source
          cp -a /tmp/market-source/. .
          rm -f source_archive.zip
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were found."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Restore complete project from source archive"
            git push origin HEAD:main
          fi
